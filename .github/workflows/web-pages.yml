name: Interface web (GitHub Pages)

# Teste puis publie le dossier `web/` (site statique, sans étape de build) sur GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle remplace celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests unitaires (runner Node intégré)
        working-directory: web
        run: node --test tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Ne publier que le site (pas les tests ni package.json)
        run: |
          mkdir -p _site
          cp -r web/index.html web/style.css web/js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
